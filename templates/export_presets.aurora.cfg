; AuroraOS export preset for Godot 4 (fork savegame/godot, 4.7.2-auroraos1).
;
; This file is a TEMPLATE. scripts/build_x86_64_rpm.sh renders it and appends
; the result to your project's export_presets.cfg when no AuroraOS preset
; exists (or with --force-preset).
;
; Only the AuroraOS platform plugin from the savegame/godot fork understands
; this preset. Stock Godot will ignore it.

[preset.0]

name="@PRESET_NAME@"
platform="AuroraOS"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="@EXCLUDE@"
export_path=""
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=false
texture_format/etc2_astc=true
shader_baker/enabled=false
binary_format/arm64=true
binary_format/arm32=false
package/organization="@ORG@"
package/name="@APP@"
package/launcher_name="@TITLE@"
package/version="@VERSION@"
package/release=@RELEASE@
launcher_icons/icon_86x86="res://icons/86.png"
launcher_icons/icon_108x108="res://icons/108.png"
launcher_icons/icon_128x128="res://icons/128.png"
launcher_icons/icon_172x172="res://icons/172.png"
@PERMISSIONS_BLOCK@
package_signing/enabled=true
package_signing/use_sdk_keys=true
package_validation/enabled=true
device/install_after_export=false
